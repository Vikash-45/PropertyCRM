name: Build & Verify Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Generate CI Keystore for Release APK
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias propertycrm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "PropertyCRM@2026" \
            -keypass "PropertyCRM@2026" \
            -dname "CN=PropertyCRM, OU=Mobile, O=PropertyCRM, L=Noida, ST=UP, C=IN"

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_PASSWORD: "PropertyCRM@2026"
          KEY_ALIAS: "propertycrm"
          KEY_PASSWORD: "PropertyCRM@2026"

      - name: Print APK Checksums
        run: |
          echo "=== DEBUG APK CHECKSUM ==="
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee debug_checksum.txt
          echo "=== RELEASE APK CHECKSUM ==="
          sha256sum app/build/outputs/apk/release/app-release.apk | tee release_checksum.txt

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PropertyCRM-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PropertyCRM-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7
